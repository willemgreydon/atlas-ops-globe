name: Intel Vault Sync

# Keeps the Turso-hosted Intelligence Vault fresh. Writes go through a libsql
# embedded replica (write-forwarded to the Turso primary, ~tens of ms/statement),
# so we sync the small, fresh-sensitive domains often and the large, slow-moving
# ones once a day to stay well inside the job timeout. The initial bulk load is
# done separately with `pnpm db:seed-turso`.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   TURSO_DATABASE_URL (or TURSO_DB_URL), TURSO_AUTH_TOKEN
#   OPENSKY_CLIENT_ID, OPENSKY_CLIENT_SECRET, NEWSAPI_KEY, EVENTREGISTRY_API_KEY,
#   ACLED_USERNAME, ACLED_PASSWORD, MARINETRAFFIC_API_KEY, AISSTREAM_API_KEY,
#   RELIEFWEB_APPNAME, NVD_API_KEY, SPACE_TRACK_USERNAME, SPACE_TRACK_PASSWORD,
#   FINNHUB_API_KEY, POLYGON_API_KEY, TWELVEDATA_API_KEY, ALPHAVANTAGE_API_KEY,
#   NASA_API_KEY

on:
  schedule:
    - cron: "0 */3 * * *" # light: news + disasters, every 3h
    - cron: "30 4 * * *" # heavy: slow-moving domains, daily 04:30 UTC
  workflow_dispatch:
    inputs:
      domains:
        description: "Domains to sync (space-separated), or leave blank for the light set"
        type: string
        default: ""

concurrency:
  group: intel-sync
  cancel-in-progress: false

# The snapshot-refresh step commits the regenerated data/vault-snapshot.db back
# to the branch, so the job needs write access to repo contents.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Persist the token so the snapshot-commit step can push back.
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Choose domains
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.domains }}" ]; then
            echo "domains=${{ github.event.inputs.domains }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 4 * * *" ]; then
            # Heavy daily (04:30): satellites (TLEs age in ~2 days) PLUS the fast
            # media domains, because this is the run that commits the fallback
            # snapshot (see the snapshot steps below) — so it must fold in the
            # freshest news/conflict/disasters. Near-static reference data
            # (sanctions ~19k, cyber, economics) stays OFF-schedule; refresh
            # manually when needed.
            echo "domains=space news disasters conflict" >> "$GITHUB_OUTPUT"
          else
            # Light: news (keeps the persons/orgs entity graph → Trending Entities
            # fresh) + disasters (global snapshot count) + conflict (keyless GDELT
            # baseline → Observatory Risk index & globe conflict layer; GDELT is
            # unreachable from Vercel so it can't be live-at-request). markets/
            # weather/events are served live-at-request, so they need no sync.
            echo "domains=news disasters conflict" >> "$GITHUB_OUTPUT"
          fi
      # Ingest against a LOCAL working DB seeded from the committed snapshot.
      # We do NOT use the embedded-replica (staged) path here: while Turso's
      # free-tier READ quota is blocked, constructing an embedded replica does an
      # initial pull that 403s, so the sync can't even start. Seeding from the
      # snapshot (a complete vault) gives the ingestors full reference data to
      # build on without any Turso read; the fresh rows are mirrored to the
      # primary in the next step.
      - name: Sync vault (local, seeded from snapshot)
        run: |
          cp data/vault-snapshot.db data/intelligence.db
          pnpm intel sync ${{ steps.pick.outputs.domains }}
        env:
          # No TURSO_* / INTEL_STAGED → db.ts uses the plain local file path.
          INTEL_DB_PATH: data/intelligence.db
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          EVENTREGISTRY_API_KEY: ${{ secrets.EVENTREGISTRY_API_KEY }}
          ACLED_USERNAME: ${{ secrets.ACLED_USERNAME }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          MARINETRAFFIC_API_KEY: ${{ secrets.MARINETRAFFIC_API_KEY }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          SPACE_TRACK_USERNAME: ${{ secrets.SPACE_TRACK_USERNAME }}
          SPACE_TRACK_PASSWORD: ${{ secrets.SPACE_TRACK_PASSWORD }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}

      # Mirror the freshly-ingested domains to the Turso primary (pure @libsql
      # WRITE batch — no pull, so it's unaffected by the read block). Best-effort:
      # if writes are ever blocked too, the snapshot is still refreshed below and
      # the primary reconciles on the next run once writes are allowed. Keeping
      # the primary current means live reads return fresh data the moment the
      # read block lifts.
      - name: Mirror fresh domains to Turso (best-effort)
        continue-on-error: true
        run: pnpm db:push-delta ${{ steps.pick.outputs.domains }}
        env:
          INTEL_DB_PATH: data/intelligence.db
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      # Refresh + commit the read-only vault snapshot — the fallback the app serves
      # when Turso reads are blocked (see lib/intel/db.ts getReadDb). Gated to the
      # DAILY run (and manual dispatch) only: the snapshot is a ~35MB binary and
      # committing it on every 3h sync would add ~8GB/month of git history. The 3h
      # light runs still ingest + mirror to Turso, so the primary stays fresh for
      # when the read block lifts; the committed fallback refreshes once a day.
      # (Permanent fix: move the snapshot off git / upgrade Turso — see the audit.)
      - name: Refresh vault snapshot
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 4 * * *'
        run: pnpm db:snapshot
        env:
          INTEL_DB_PATH: data/intelligence.db
          SNAPSHOT_SKIP_TURSO: "1"
          SNAPSHOT_MERGE_DOMAINS: ${{ steps.pick.outputs.domains }}

      - name: Commit snapshot if changed
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 4 * * *'
        run: |
          if git diff --quiet -- data/vault-snapshot.db; then
            echo "snapshot unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vault-snapshot.db
          # No [skip ci]: this commit MUST reach Vercel so the deployed function
          # picks up the fresh snapshot. No push-triggered GitHub workflows exist,
          # so there's no Actions loop to guard against.
          git commit -m "chore(intel): refresh vault snapshot" \
            -m "Domains synced: ${{ steps.pick.outputs.domains }}"
          # Rebase onto any concurrent pushes, then push back to the same branch.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
