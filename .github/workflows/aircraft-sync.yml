name: Aircraft Sync

# OpenSky global baseline for the aircraft layer.
#
# /api/aircraft now gets real-time data from adsb.lol, fetched live from Vercel
# (adsb.lol permits datacenter egress; OpenSky does not). This snapshot is only
# the GLOBAL BASELINE merged underneath it — it fills the regions/oceans the
# community adsb.lol receiver footprint misses (Russia, China, open ocean).
# Because it is no longer the source of freshness, a few-hourly cadence is plenty
# and keeps us well inside the free Action-minute budget. Fast @libsql/client
# batch write, ~seconds. Trigger manually any time to refresh the baseline.

on:
  schedule:
    - cron: "7 */6 * * *" # every 6h, offset to avoid colliding with intel-sync
  workflow_dispatch: {}

concurrency:
  group: aircraft-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync:aircraft
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
